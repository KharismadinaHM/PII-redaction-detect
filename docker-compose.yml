version: "3.8"

services:
  pii-redaction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pii-redaction-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
